name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d1.outputs.page_url || steps.d2.outputs.page_url || steps.d3.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/src
            !/sources
            !/tools
            !/tests
      - name: Stage site
        run: |
          mkdir _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' \
            --exclude='build.py' --exclude='shiji_pages.json' --exclude='table_of_content.md' \
            --exclude='README.md' --exclude='LICENSE' --exclude='_config.yml' ./ _site/
          touch _site/.nojekyll
          du -sh _site; find _site -type f | wc -l
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # deploy-pages 的 timeout 上限就是 600000 毫秒（10 分钟），超了会被截成 10 分钟；
      # GitHub 端“同步文件”偶尔超过 10 分钟，所以失败后自动重试，最多三次
      - id: d1
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          timeout: 600000
          reporting_interval: 30000
      - id: d2
        if: steps.d1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          timeout: 600000
          reporting_interval: 30000
      - id: d3
        if: steps.d1.outcome == 'failure' && steps.d2.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
          reporting_interval: 30000
