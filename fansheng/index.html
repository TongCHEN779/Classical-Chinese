<h1>西湖老人繁胜录<small>［南宋］西湖老人</small></h1>
<p class="intro">此书收入《永乐大典》卷之七千六百三十八阳杭州府五十二。《四库全书总目》︰《西湖繁胜录》一卷，《永乐大典》本。旧本题西湖老人撰，不著名氏。考书中所言，盖南宋人作也。宋自和议既成之后，不复留意于中原，士大夫但知流连歌舞，啸傲湖山。故是书所述，大抵嬉游之事，以繁华靡丽相夸。盖亦耐得翁《都城纪胜》之类，而琐屑又甚焉。</p>
