<h1>陶庵梦忆<small>［明］张岱</small></h1>
<p class="intro">《陶庵梦忆》为明朝散文家张岱所著。该书成书于甲申明亡（1644年）之后，直至乾隆四十年（1775年）才初版行世。全书八卷。追写了明代江南民间的风俗人情，同时含有大量关于明代日常生活、娱乐、戏曲、古董等的纪录。</p>
