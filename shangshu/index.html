<h1>尚书<small>［先秦］佚名</small></h1>
<p class="intro">《尚书》是中国最早的历史文献汇编，编者已不可考，司马迁、班固将编订归于孔子，儒家后来把它列入六经。传世文本有今文、古文之别，后出的古文篇长期受到辨伪。清华简保存了一些与传世《尚书》相关的文本，也有传世本未见的篇章。</p><p class="intro">简介据<a href="https://zh.wikisource.org/w/index.php?title=尚書&amp;oldid=11123919">维基文库</a>改写。</p>
