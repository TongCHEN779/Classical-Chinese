<h1>续玄怪录<small>［唐］李复言</small></h1>
<p class="intro">唐李复言撰。是书世有二本：其附载牛僧孺《幽怪录》末者，盖从《说郛》录出。一即此本，凡二十三事，与《唐志》卷数亦不符。盖从《太平广记》录出者，虽稍多于《说郛》本，然亦非完帙也。</p>
