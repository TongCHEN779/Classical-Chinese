<h1>卷一百〇三·表第四 诸王世表四<small>明史</small></h1>

<div class="reading-content">
<section class="entry" id="e1">
<p class="v nv">建文初，封弟允熥为吴王，允熞为衡王，允熙为徐王，皆懿文太子子也。福王时，追谥吴王曰悼，衡王曰愍，徐王曰哀，见福王传。</p>
<p class="v nv">成祖四子。仁宗外，高爔未封。其得封者二王，曰汉王高煦，曰赵简王高燧。</p>
<p class="v nv">仁宗十子。宣宗外，瞻垠未封。其得封者八王，曰郑靖王瞻埈，曰越靖王瞻墉，曰襄宪王瞻墡，曰荆宪王瞻堈，曰淮靖王瞻墺，曰滕怀王瞻垲，曰梁庄王瞻垍，曰卫恭王瞻埏。</p>
</section>
