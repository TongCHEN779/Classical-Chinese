<h1>般若波罗蜜多心经<small>［唐］玄奘译</small></h1>
<p class="intro">唐玄奘译，只有二百六十字，是《大般若经》六百卷的精要：观自在菩萨照见五蕴皆空，说“色即是空，空即是色”，并以咒语作结，是汉传佛教最广为诵读的经。</p>
