<p class="v nv">嘉祐六年八月十一日</p>
<p class="v nv">敕，节文：宋书、齐书、梁书、陈书、后魏书、北齐书、后周书，见今国子监并未有印本，宜令三馆秘阁，见编校书籍官员，精加校勘，同典管勾使臣，选择楷书，如法书写板样，依唐书例，逐旋封送杭州开板。</p>
