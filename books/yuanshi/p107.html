<section class="entry" id="e1">
<p class="v nv">后妃之制，厥有等威，其来尚矣。元初，因其国俗，不娶庶姓，非此族也，不居嫡选。当时史臣以为舅甥之贵，盖有周姬、齐姜之遗意，历世守之，固可嘉也。然其居则有曰斡耳朵之分，没复有继承守宫之法。位号之淆，名分之渎，则亦甚矣。累朝尝诏有司修后妃传，而未见成书。内廷事秘，今莫之考，则其氏名之仅见简牍者，尚可遗而不录乎？且一代之制存焉，阙疑而慎言，斯可矣。作后妃表。</p>
