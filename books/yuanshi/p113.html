<section class="entry" id="e1">
<p class="v nv">宰相者，上承天子，下统百司，治体系焉。元初，将相大臣，年月疏阔，简牍未详者则阙之。中统建元以来，宰执之官，其拜罢岁月之可考者，列而书之。作宰相年表。</p>
