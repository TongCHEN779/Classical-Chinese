<section class="entry" id="e1">
<p class="v nv">昔周封列国七十，而同姓者五十三人；汉申丹书之信，而外戚侯者恩寖广矣。诗曰：“大邦维屏，大宗维翰。”其此之谓乎？元兴，宗室驸马，通称诸王，岁赐之颁，分地之入，所以尽夫展亲之义者，亦优且渥。然初制简朴，位号无称，惟视印章，以为轻重。厥后遂有国邑之名，而赐印之等犹前日也。得诸掌故，具著于篇。作诸王表。</p>
