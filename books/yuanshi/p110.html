<section class="entry" id="e1">
<p class="v nv">昔者史臣有言，妇人内夫家，虽天姬之贵，史氏犹外而弗详。然元室之制，非勋臣世族及封国之君，则莫得尚主，是以世联戚畹者，亲视诸王，其藩翰屏垣之寄，盖亦重矣。则其世次，顾可以弗之著耶？且秦汉以来，惟帝姬得号公主，而元则诸王之女亦概称焉，是又不可不知也。惜乎记载弗备，所可见者，仅此而已。作诸公主表。</p>
