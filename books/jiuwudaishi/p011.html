<h3>文惠皇太后</h3>
<p class="v nv">文惠皇太后王氏，开平初追谥。太祖性孝愿，奉太后未尝小失色，朝夕视膳，为士君子之规范。帝严察用法，无纤毫假贷，太后言之，帝颇为省刑。</p>
</section>
<section class="entry" id="e2">
<h3>元贞皇后</h3>
<p class="v nv">元贞皇后张氏，乾化中追谥。</p>
</section>
<section class="entry" id="e3">
<h3>德妃 张氏</h3>
<p class="v nv">末帝德妃张氏。</p>
