<section class="entry" id="e1">
<p class="v nv">或谓“六十四回不结而结，甚善。顾既曰全书矣，而简端又无序，毋乃阙欤？”</p>
<p class="v nv">华也怜侬曰：“是有说。昔冬心先生续集自序，多述其生平所遇前辈闻人品题赞美之语。仆将援斯例以为之，且推而广之。凡读吾书而有得于中者，必不能已于言。其言也，不徒品题赞美之语，爱我厚而教我多也。苟有以抉吾之疵、发吾之覆、振吾之聩、起吾之痾，虽至呵责唾骂、讪谤诙嘲，皆当彔诸简端，以存吾书之真焉。敬告同人，毋閟金玉！”</p>
<p class="v nv">光绪甲午孟春，云间华也怜侬识于九天珠玉之楼。</p>
</section>
