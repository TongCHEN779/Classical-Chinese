<section class="entry" id="e1">
<p class="v"><span class="s" tabindex="0" data-t="不厌弃伦理正道，便是忠孝传家。">不厌伦理正道，便是忠孝传家。</span></p>
<p class="v"><span class="s" tabindex="0" data-t="任凭铺叙错综，只管本来的题目。">任其铺叙错综，只顾本来题目。</span></p>
<p class="v"><span class="s" tabindex="0" data-t="不要说是僧道的玄言，其实关系纲常正理。">莫云僧道玄言，实关纲常正理。</span></p>
<p class="v"><span class="s" tabindex="0" data-t="虽说荒唐不经，却有禅家的宗旨。">虽说荒唐不经，却有禅家宗旨。</span></p>
<p class="v"><span class="s" tabindex="0" data-t="尊者的教化本来无言，暂借师徒来阐发奥义。">尊者教本无言，暂借师徒发奥。</span></p>
<p class="v"><span class="s" tabindex="0" data-t="中间的妖魔邪魅，不过是装饰热闹。">中间妖魔邪魅，不过装饰闹观。</span></p>
<p class="v"><span class="s" tabindex="0" data-t="总的直接关系风化，不怕高明之人指摘。">总来直关风化，不避高明指摘。</span></p>
<p class="v"><span class="s" tabindex="0" data-t="若能提醒警醒人的善心，便遂了作书的鄙意。">若能提警善心，便遂作记鄙意。</span></p>
</section>
