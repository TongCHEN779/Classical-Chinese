<h1>夜雨秋灯录<small>［清］宣鼎</small></h1>
<p class="intro">光绪三年（1877年），《夜雨秋灯录》由上海申报馆以仿聚珍版印行问世，共八卷一百一十五篇（赝本缺卷二、四、六、八内篇目及卷三之《父子同日成婚皆元配》，唯补入他文）；光绪六年（1880年），又出《夜雨秋灯续录》，仍为八卷一百一十五篇。</p>
