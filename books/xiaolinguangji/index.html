<h1>笑林广记<small>［清］游戏主人</small></h1>
<p class="intro">中国古代的一本笑话集，由清代的游戏主人收集而成。笑林广记全书共分十二部，一古艳（官职科名等）、二腐流、三术业、四形体、五殊禀（痴呆善忘等）、六闺风、七世讳（帮闲娼优等）、八僧道、九贪吝、十贫窭、十一讥刺、十二谬误。笑林广记取材多自明清时之笑话，形式上以短小精悍为主。</p>
