<p class="v nv">◎属国表</p>
<p class="v nv">周有天下，不期而会者八百馀国。辽居松漠，最为强盛。天命有归，建国改元。号令法度，皆遵汉制。命将出师，臣服诸国。人民皆入版籍，贡赋悉输内帑。东西朔南，何啻万里。视古起百里国而致太平之业者，亦几矣。故有辽之盛不可不著。作《属国表》。</p>
