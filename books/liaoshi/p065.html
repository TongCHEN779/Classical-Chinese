<section class="entry" id="e1">
<p class="v nv">春秋之法，王姬下嫁书于策，以鲁公同姓之国为之婚主故尔。古者，妇讳不出门，内言不出梱。公主悉列于传，非礼也。然辽国专任外戚，公主多见纪、传间，不得不表见之。礼，男女异长，不当与皇子同列，别为公主附表。</p>
