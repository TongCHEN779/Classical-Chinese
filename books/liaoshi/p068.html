<p class="v nv">◎游幸表</p>
<p class="v nv">朔漠以畜牧射猎为业，犹汉人之劭农，生生之资于是乎出。自辽有国，建立五京，置南北院，控制诸夏，而游田之习，尚因其旧。太祖经营四方，有所不暇，穆宗、天祚之世，史不胜书。今援司马迁别书《封禅》例，列于表，观者固足以鉴云。作《游幸表》。</p>
